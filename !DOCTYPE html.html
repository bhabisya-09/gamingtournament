<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Tournament Registration | Interact Club of Valmiki</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
}

header{
    text-align:center;
    padding:40px 20px;
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
}

header h1{
    font-size:3rem;
    color:#38bdf8;
}

header p{
    margin-top:10px;
    font-size:1.1rem;
    color:#cbd5e1;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

.form-card{
    background:rgba(255,255,255,0.08);
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.form-card h2{
    text-align:center;
    color:#38bdf8;
    margin-bottom:20px;
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#f1f5f9;
    color:#000;
}

.team-member{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#0ea5e9;
    color:white;
    font-size:1rem;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    background:#0284c7;
}

footer{
    text-align:center;
    padding:20px;
    color:#94a3b8;
}

.success{
    display:none;
    text-align:center;
    margin-top:20px;
    color:#4ade80;
    font-size:1.2rem;
    font-weight:bold;
}

@media(max-width:600px){
    .team-member{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:2rem;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎮 Gaming Tournament</h1>
    <p>Organized by Interact Club of Valmiki</p>
</header>

<div class="container">
    <div class="form-card">

        <h2>Team Registration Form</h2>

        <form id="registrationForm">

            <div class="input-group">
                <label>Team Name</label>
                <input type="text" required>
            </div>

            <div class="input-group">
                <label>Team Leader</label>
                <input type="text" required>
            </div>

            <div class="input-group">
                <label>Leader Phone Number</label>
                <input type="tel" required>
            </div>

            <h3 style="margin:20px 0;color:#38bdf8;">Team Members</h3>

            <div class="team-member">
                <input type="text" placeholder="Member 1 Name" required>
                <input type="tel" placeholder="Phone Number" required>
            </div>

            <div class="team-member">
                <input type="text" placeholder="Member 2 Name" required>
                <input type="tel" placeholder="Phone Number" required>
            </div>

            <div class="team-member">
                <input type="text" placeholder="Member 3 Name" required>
                <input type="tel" placeholder="Phone Number" required>
            </div>

            <div class="team-member">
                <input type="text" placeholder="Member 4 Name" required>
                <input type="tel" placeholder="Phone Number" required>
            </div>

            <button type="submit">Register Team</button>

        </form>

        <div class="success" id="successMsg">
            ✅ Registration Submitted Successfully!
        </div>

    </div>
</div>

<footer>
    © 2026 Interact Club of Valmiki | Game On!
</footer>

<script>
document.getElementById("registrationForm")
.addEventListener("submit", function(e){
    e.preventDefault();

    document.getElementById("successMsg").style.display="block";

    this.reset();
});
</script>

</body>
</html>
